name: Deploy Portfolio Prod

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Upload build to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: "dist/*"
          target: "/tmp/portfolio-dist"

      - name: Publish site
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e

            test -d /tmp/portfolio-dist/dist

            rm -rf /tmp/portfolio-live
            mkdir -p /tmp/portfolio-live
            cp -r /tmp/portfolio-dist/dist/* /tmp/portfolio-live/

            rm -rf /home/deploy/ai_assistant/docker/nginx/html/*
            cp -r /tmp/portfolio-live/* /home/deploy/ai_assistant/docker/nginx/html/

            docker restart personal_assistant_nginx_prod